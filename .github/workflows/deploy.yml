name: Deploy to Databricks Apps

# Redeploys hm-chatbot-test straight from this repo's dev branch every time
# it's pushed to. Requires two repository secrets (Settings > Secrets and
# variables > Actions): DATABRICKS_HOST (the workspace URL) and
# DATABRICKS_TOKEN (a personal access token with permission to deploy this
# app). Generated by the databricks-app-deploy skill.

on:
  push:
    branches:
      - dev
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      APP_NAME: hm-chatbot-test
    steps:
      - name: Set up Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy from git source
        run: |
          set -euo pipefail
          databricks apps deploy "$APP_NAME" --json '{"git_source": {"branch": "dev"}}'

      - name: Wait for app to be running
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            OUTPUT=$(databricks apps get "$APP_NAME" --output json || true)
            echo "--- poll $i ---"
            echo "$OUTPUT"
            if echo "$OUTPUT" | grep -qi '"RUNNING"'; then
              echo "App is running."
              exit 0
            fi
            if echo "$OUTPUT" | grep -qiE '"(FAILED|ERROR|CRASHED)"'; then
              echo "::error::Deployment reported a failed state. Full status above."
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the app to report RUNNING. Full last status above - check the Databricks workspace Apps UI for details."
          exit 1
